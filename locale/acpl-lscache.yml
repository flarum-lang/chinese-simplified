    purge_on_discussion_update_help: '填写讨论更新时需要清除的 URL 或缓存标签，每行一项。URL 必须以 <code>/</code> 开头，例如 <code>/rankings</code>；缓存标签必须以 <code>tag=</code> 开头，例如 <code>tag=rankings</code>。如果需要匹配多个路由，请在 .htaccess 中通过正则表达式为这些路由添加缓存标签，然后在此填写对应标签，<a>了解更多</a>。默认情况下，首页和被更新讨论的缓存会自动清除。'
    purge_on_discussion_update_label: '讨论更新时清除指定 URL 或缓存标签'
