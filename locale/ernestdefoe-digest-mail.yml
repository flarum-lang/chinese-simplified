      queue_chunk_size_label: 队列批次大小
      queue_delay_help: '设置队列任务在可被 Worker 处理前等待的秒数（默认 0）。使用发送窗口时通常不需要，因为发送窗口本身已经会将负载分散到一段时间内。主要用于超大型论坛采用两阶段 digest:enqueue 命令时。'
      queue_delay_label: 任务延迟（秒）
