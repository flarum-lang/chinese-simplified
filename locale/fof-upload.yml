fof-upload:
  admin:
    help_texts:
      client_extension: "默认情况下，Upload 会根据 MIME 类型选择安全的文件扩展名。\n对于某些基于 ZIP 或二进制数据的文件类型，可能会替换为较通用的扩展名，而不是预期的原始扩展名。\n你可以在此填写以逗号分隔的文件扩展名列表，这些文件的扩展名将原样保留。\n"
      composer_buttons: "默认同时显示媒体管理器和上传按钮。你也可以选择只显示其中一个。\n"
      custom_s3_url: "文件对外提供访问时使用的基础 URL，例如存储桶的 CDN 地址或自定义域名。\n留空则使用服务提供商的默认 URL。必须包含 <code>https://</code>。\n"
      disable-download-logging: "禁用后将不再记录论坛用户的每次下载。保持启用可以统计下载次数，并用于其他下载数据分析。\n"
      disable-hotlink-protection: "防盗链可阻止从其他网站直接打开下载链接。当前实现依赖 CSRF 令牌和帖子 ID。\n"
      download_templates: "下载模板决定上传文件在论坛中的显示方式，例如显示为预览或下载按钮。当前可用模板：\n"
      local_cdn: "文件的公开访问地址。本地存储留空时使用论坛自身地址。\n使用七牛云时需填写空间访问域名或自定义 CDN 域名。S3 可单独配置公开 URL。\n"
      mime_order: "规则从上到下依次匹配，并采用第一个匹配结果，因此请将更具体的规则放在通用规则之前。\n"
      mime_types: "设置用户可以上传的文件类型、文件存储位置，以及在帖子中的展示方式。\n"
      resize: "设置是否在图片上传前调整尺寸。以像素为单位，超过最大宽度或高度后自动缩放图片，调整时会保持图片原始宽高比。\n"
      s3_acl: "应用于每个上传对象。留空则使用服务提供商的默认值，通常为私有。\n如果文件需要直接从存储桶公开访问，请使用 <code>public-read</code>。\n"
      s3_acl_unsupported: "{provider} 不支持 ACL。请前往服务提供商自己的控制台配置公开访问权限。\n"
      s3_compatible_storage: "填写下方设置以配置 S3 兼容存储模式。如果您使用 AWS，请保持留空。有关 S3 兼容配置详情，请查阅各大云服务商的文档（七牛云：https://iflarum.cn/qiniu-s3）\n"
      s3_endpoint: "服务提供商的 S3 API 地址，不是存储桶的公开 URL。Amazon S3 无需填写。\n"
      s3_instance_profile: "两个字段均留空时会改用 IAM 角色，仅适用于 EC2、ECS 或 EKS。\n"
      s3_path_style: "将存储桶名称放在 URL 路径中，而不是主机名中。MinIO 和 Cloudflare R2 需要使用此模式。\n选择相应服务提供商后会自动设置。\n"
      s3_provider: "选择服务提供商后，会自动设置下方的 Endpoint 格式、寻址方式和 ACL 支持情况。\n如果你的服务不在列表中，请选择「其他 S3 兼容服务」。\n"
      storage_configure_another: "还有其他已安装但尚未配置的存储服务。\n配置完成后，请前往「文件」标签页，将相应的文件类型指定到该存储服务。\n"
      storage_intro: "此处会显示已配置或正在使用的存储服务。\n你可以先配置存储服务，之后再前往「文件」标签页，为相应的文件类型指定存储位置。\n"
      storage_not_installed: '需要 Amazon S3、Cloudflare R2 或七牛云？这些服务需要安装额外的软件包，请参阅<a>安装存储适配器</a>。'
      thumbnail_quality: "设置 WebP 和 JPEG 缩略图的编码质量，范围为 1 至 100。\n数值越高，画质越清晰，文件也越大。GIF 和 PNG 缩略图为无损格式，不受此设置影响。\n现有缩略图会继续使用原来的质量，除非通过 backfill 命令重新生成。\n"
      thumbnails: "上传图片时生成小尺寸缩略图，并在帖子中显示。点击缩略图会在新标签页打开原始高清图片。\n对于包含大量大尺寸图片的论坛，缩略图可以显著减少流量和页面体积。\n"
      watermark: "设置是否在图片上传时添加水印。非 GIF 图片会根据下方设置添加水印。\n"
    inspect-mime:
      description: "FoF Upload 优先使用 <a>PHP Mime Detector</a> 库识别常见 MIME 类型，并以 PHP Fileinfo 作为备用方案。\n不同服务器上的 Fileinfo 可能返回不同的 MIME 类型！\n"
