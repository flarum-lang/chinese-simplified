      country_header_help: '填写代理用于传递访客两位国家或地区代码的请求头，例如 Cloudflare 的 CF-IPCountry，或 nginx-geoip 使用的 X-Country。系统会直接信任该请求头的值，因此仅应填写确实由你的代理设置的请求头；如果你的代理不会设置这类请求头，请留空，并改用匿名化 IP 前缀识别国家或地区。'
      country_header_label: 受信任的国家或地区请求头
      geo_ip_prefix_help: '如果代理未提供国家或地区请求头，系统会在 72 小时缓冲区中保留截断后的 IP 前缀（不会保存完整 IP 地址），以便在本地识别访客所在国家或地区。关闭后，对于没有代理提供国家或地区信息的访问，将不再统计国家或地区数据。'
      geo_ip_prefix_label: '通过匿名化 IP 前缀识别国家或地区'
      geoip_db_path_help: '填写此服务器上的 MaxMind 数据库完整路径，例如免费的 GeoLite2-Country.mmdb（需使用你自己的账号从 maxmind.com 下载）。仅在受信任的代理请求头未提供国家或地区信息时使用，所有查询都会在本服务器完成。'
      geoip_db_path_label: 国家或地区数据库文件（可选）
      weekly_digest_help: 每周一向管理员发送上周摘要，包括访客、浏览量、帖子、注册、热门讨论和热门搜索。邮件通过论坛自身的邮件系统发送，分析数据不会发送给第三方服务。
      weekly_digest_label: 每周邮件摘要
