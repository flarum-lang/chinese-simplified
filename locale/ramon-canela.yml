        body: "感谢接受邀请并加入%{site_name}，欢迎！\n\n- 我们已为你创建新账号**%{username}**。你可以在[设置](%{user_preferences_url})中更改姓名或密码。\n\n我们始终倡导[文明友善的社区行为](%{guidelines_url})。\n\n祝你在这里度过愉快时光！"
