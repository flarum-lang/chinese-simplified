      user_activity_read_label: 已读标签页
      user_activity_solved_help: 在“动态”下显示被选为最佳答案的用户回复。
      user_activity_solved_label: 已解决标签页
      user_activity_votes_help: 在“动态”下显示用户参与投票的帖子。其他人只能看到公开投票者的投票。
