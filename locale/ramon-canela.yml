        subject: 恭喜你提升了信任等级！
        title: 信任等级2
      unsilenced:
        body: "你好，\n\n这是%{site_name}发送的自动消息，通知你账号的暂停状态已解除。\n\n你现在可以重新发起讨论和回复了。感谢你的耐心等待。"
