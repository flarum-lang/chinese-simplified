        variables: '变量：{list}'
      flags_agreed_and_post_deleted:
        body: "你好，\n\n这是%{site_name}发送的自动消息，通知你[你的帖子](%{base_url}%{url})已被移除。\n\n%{flag_reason}\n\n社区成员举报了此帖子，工作人员决定将其移除。\n\n```\n%{flagged_post_raw_content}\n```\n\n详情请查看我们的[社区指南](%{guidelines_url})。"
        help: 工作人员隐藏或删除含有举报的帖子时发送。需要Flags扩展（flarum/flags）。
        subject: 工作人员已移除被举报的帖子
        title: 被举报的帖子已移除
      silenced_by_staff:
        body: "你好，\n\n这是%{site_name}发送的自动消息，通知你账号已被暂停，暂停期限至%{suspended_till}。\n\n%{reason}\n\n你仍可浏览论坛，但在暂停结束前无法参与互动。如有疑问，请联系[工作人员](%{base_url}/about)。"
