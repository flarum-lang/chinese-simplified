        toc_help: '在首帖中加入[toc]（编辑器⊕菜单中有“插入目录”），标题就会显示在时间线栏中，当前标题会高亮，并提供“跳转到末尾”。下方按钮可在“目录”和“时间线”之间切换，选择会保存在浏览器中。手机上，目录显示在时间线面板中。'
        toc_min_headings_help: 首帖中的标题少于此数量时，不显示目录。
        toc_min_headings_label: 最少标题数
        toc_title: 目录
      embedded_replies_help: '点击每篇帖子的"N条回复"会在其下方展开回复，并在上方显示被引用的帖子，类似Discourse。'
      embedded_replies_label: 嵌入式回复
      events:
        backend_off: 服务器尚未加载活动后端（extend/events.php）。
        events_chat_help: 活动创建器会提供“活动聊天”选项：为该活动创建专属的ramon/chat频道，并关联讨论标签；标记为“参加”的用户会加入该频道。
        events_chat_label: 活动聊天
        events_docked_chat_help: 桌面端会在讨论右侧以全高栏显示活动频道。手机和平板上，活动卡片会提供聊天链接。
        events_docked_chat_label: 在讨论旁显示聊天
        events_enabled_help: 在编辑器⊕菜单中选择“创建活动”，即可将活动添加到首帖：设置日期、时间、时区、重复规则、直播地址、地点和参与人数上限。帖子会显示活动卡片，包含“参加”“感兴趣”和“不参加”选项、参与者以及“添加到日历”（Google日历和.ics）。关闭后，卡片会改为文字显示，API也会像此功能不存在一样响应。
        events_list_badge_help: 在讨论列表标题旁和讨论页标题中显示活动日期（如“3天后”“2天前”）。
        events_list_badge_label: 列表和标题中的日期
        events_reminder_minutes_help: 每次活动开始前多少分钟向标记为“参加”的用户发送提醒。设为0可关闭提醒。
        events_reminder_minutes_label: 活动开始前提醒
        events_tag_any: 任何标签
        events_tag_help: 只有在此标签下发起讨论时才会显示“创建活动”按钮；只有此标签下的讨论会显示活动卡片、出现在“即将开始的活动”中并发送提醒。凡是有权在该标签下发起讨论的人都可以创建活动（遵循标签自身的权限设置）。选择“任何标签”后，所有讨论均适用。
        events_tag_label: 活动标签
        events_upcoming_help: 侧边栏中的“活动”链接、/events页面（列表和日历），以及活动标签列表顶部的下一场活动日期。
        events_upcoming_label: 即将开始的活动
        minutes: 分钟
        reminders_notice: '提醒由Flarum计划任务每五分钟发送一次：服务器必须配置cron，每分钟运行一次“php flarum schedule:run”。'
        title: 活动
      extras:
        banner_enabled_help: 每个页面的内容上方都会显示一条横幅，并带有关闭按钮。关闭横幅的人不会再看到它，直到文字发生变化。
        banner_enabled_label: 显示横幅
        banner_reshow: 向曾关闭横幅的人重新显示
