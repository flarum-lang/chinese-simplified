        print_title: 打印讨论
        print_topic_enabled_help: 将所有帖子载入简洁视图（不含侧边栏、页眉或时间线），然后打开浏览器的打印对话框，也可以在其中另存为PDF。
        print_topic_enabled_label: 讨论控制菜单中的“打印”项
        search_notice: '也可以在搜索框中输入筛选快捷语：in:title、in:likes、in:bookmarks和min-posts:5，以及Flarum自带的筛选语（author:、tag:、is:locked…）。'
        search_page_enabled_help: Discourse风格的/search页面：提供讨论、帖子、标签和用户标签页，以及高级筛选器（作者、主要标签、标签、仅标题、已点赞、状态、日期、最少帖子数）和排序。搜索弹窗会添加“高级搜索”链接。
        search_page_enabled_label: 高级搜索页面
        search_title: 搜索页面
        text_size_enabled_help: 每个人都可以在设置中选择较小、正常、较大或最大字号。选择仅应用于当前设备（保存在浏览器中），类似Discourse。
        text_size_enabled_label: 选择文字大小
        text_size_title: 文字大小
        top_periods_enabled_help: 热门标签页提供“全部时间/年/季度/月/周/今天”选项，只显示在对应时间范围内创建的讨论。
        top_periods_enabled_label: 热门标签页的时间范围选择器
        top_periods_title: 按时间范围查看热门讨论
      font_help: '用于整个论坛的字体。主题内置Inter和Plus Jakarta Sans，适用于拉丁文字；系统字体无需下载，并支持所有文字系统。'
