        body: "你好！我们看到你最近读了不少内容，真棒，所以已将你的信任等级提升一级！\n\n很高兴你愿意花时间参与社区，也希望进一步了解你。欢迎[完善个人资料](%{user_url})，或[发起新讨论](%{base_url})。"
        help: 用户升至信任等级1（基础）时发送。需要启用信任等级。
        subject: 感谢你花时间参与社区
        title: 信任等级1
      welcome_user:
