        subject: 你的账号已恢复正常
        title: 暂停已解除
      user_added_to_group_as_member:
        body: '你已成为[%{group_name}](%{base_url}%{group_path})用户组的成员。'
        help: 用户加入管理员和版主以外的用户组时发送。默认关闭，类似Discourse。
        subject: '你已加入%{group_name}用户组'
        title: 加入用户组
