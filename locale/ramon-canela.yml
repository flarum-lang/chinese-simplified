      user_activity_reactions_help: 在“动态”下以单个列表显示用户发出的点赞和回应，取代“点赞”页面，并附上表情符号和帖子摘要。只有有权查看回应者的人才能看到回应。
      user_activity_reactions_label: 回应标签页
