        footnotes_help: '脚注写法：在帖子末尾使用“text[^1]”和“[^1]: the note”，也可以使用行内脚注“^[the note]”。编号会以小号上标显示，点击后会在提示框中打开脚注。编辑器⊕菜单中会出现“脚注”选项。关闭后，脚注会保留为“[1]”和“[1]: text”。'
