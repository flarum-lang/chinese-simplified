      http_only_label: '仅查询 HTTP(S) Tracker'
      max_trackers_help: '每个磁力链接最多查询多少个 Tracker。设为 0 使用内置安全上限（12 个）。同时受总抓取时间限制，避免单个磁力链接长时间占用 PHP 工作进程。'
      max_trackers_label: '最多查询 Tracker 数'
      name_max_lines_help: 种子名称最多显示多少行，超过后会在最后一行以省略号截断。仅适用于移动端布局，包括手机以及桌面端选择移动端样式时。
      name_max_lines_label: 名称最多显示行数
      priority_trackers_help: '可选，每行填写一个 Tracker 主机，例如 tracker.opentrackr.org。磁力链接包含这些 Tracker 时，会按这里的顺序优先查询。在默认的「首个响应即停止」模式下，可优先使用可信 Tracker，并改善响应速度和统计准确性。这里只调整已有 Tracker 的顺序，不会添加链接中不存在的 Tracker；其他安全检查和限制仍然生效。'
      priority_trackers_label: '优先 Tracker'
      refresh_cooldown_help: '同一磁力链接全站手动刷新的最短间隔。一次刷新会更新所有人看到的共享结果，冷却结束前不能再次刷新。设为 0 表示不限制。共享刷新结果需要启用缓存。'
      refresh_cooldown_label: 刷新冷却时间（秒）
      refresh_limit_count_help: '单个 IP 在下方时间窗口内最多可手动刷新多少次，访客同样受限。设为 0 表示不限制。'
      refresh_limit_count_label: '刷新次数上限（每 IP）'
      refresh_limit_window_help: '每 IP 刷新次数限制采用的滚动时间窗口。每次刷新超过该时间后会释放一次额度。默认 600 秒（10 分钟）。'
      refresh_limit_window_label: 刷新次数统计窗口（秒）
      rename_enabled_help: 允许帖子作者修改自己帖子中磁力链接的显示名称。
      rename_enabled_label: 允许自定义种子名称
      scraper_enabled_help: '启用后，会查询 Tracker 获取做种、下载者和完成下载统计；关闭后仅显示种子名称和点击数。'
      scraper_enabled_label: '启用 Tracker 抓取'
      scraper_engine_classic: 经典（兼容）
      scraper_engine_hardened: '强化（固定 IP、IPv6、严格 TLS）'
      scraper_engine_help: '强化模式（默认）使用 cURL，并固定域名解析得到的 IP，可防止 DNS 重绑定造成 SSRF，同时支持 UDP Tracker 的 IPv6，并严格校验 TLS。需要 PHP cURL 扩展，证书异常或使用自签名证书的 Tracker 可能无法访问。经典模式使用 file_get_contents，无需 cURL，但仍存在 DNS 重绑定风险，仅建议在无法使用 cURL 时选择。'
      scraper_engine_label: 抓取引擎
      scraper_host_allowlist_help: '可选，每行填写一个可信 Tracker 主机。填写后只会连接白名单中的主机，帖子中的其他 Tracker URL 会直接跳过，从而阻断恶意 Tracker 带来的 SSRF / DNS 重绑定风险。留空则允许查询任意公网 Tracker；其他安全检查和限制仍然生效。'
      scraper_host_allowlist_label: 'Tracker 主机白名单'
      scraper_max_redirects_help: '抓取 HTTP(S) Tracker 时最多跟随多少次重定向。默认 0，即不跟随。如果 Tracker 位于 Cloudflare 或会将 http 重定向到 https 的 CDN 后，可设为 1–2。每次跳转仍会经过 SSRF 检查，无法转向私有或内网地址。'
      scraper_max_redirects_label: 'Tracker 最大重定向次数'
      self_interval_help: '同一 IP 再次点击同一个磁力链接，需要间隔多久才会再次计入点击数。'
