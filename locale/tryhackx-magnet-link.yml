tryhackx-magnet-link:
  admin:
    maintenance:
      help: '活跃或受机器人频繁访问的论坛中，magnet_clicks 和 magnet_bans 表可能快速增长。系统默认不自动清理，因为讨论点击排序会直接读取 magnet_clicks，保留期限由你决定。可将以下命令加入服务器 cron，例如每日运行：php flarum magnet:prune-clicks --days=90 和 php flarum magnet:prune-bans'
      label: 表数据保留（大型论坛）
    reparse:
      button: 重新解析历史磁力链接
      error: 重新解析磁力链接失败，请检查服务器日志。
      help: '启用本扩展前发布的磁力链接仍以纯文本保存，因此无法在帖子中渲染，也不会出现在悬浮提示中。启用扩展或导入旧内容后运行一次即可。大型论坛请使用 CLI：php flarum magnet:reparse'
      label: 重新解析历史磁力链接
      success: '已重新解析 {count} 个帖子。'
    retokenize:
      button: 更新磁力链接令牌
      error: 更新磁力链接令牌失败，请检查服务器日志。
      help: '磁力链接令牌用于隐藏页面源码中的真实链接，只有通过权限检查的 API 才能获取。旧版本使用公开的固定盐值生成令牌，已知种子的 Magnet URI 可能通过 HTML 中的令牌被离线反推。升级后请运行一次，为所有令牌改用本站独立密钥。大型论坛请使用 CLI：php flarum magnet:retokenize'
      label: 磁力链接令牌加固
      success: '已更新 {count} 个磁力链接令牌。'
    settings:
      activated_only_help: 只有已验证邮箱的已登录用户才能查看磁力链接。
      activated_only_label: 仅限已验证邮箱的用户
      allow_private_trackers_help: '默认会阻止解析到私有、回环或保留 IP 的 Tracker，以防服务器被用于访问内网服务（SSRF）。仅在确实使用内网 Tracker 时启用。'
      allow_private_trackers_label: '允许私有或内网 Tracker'
      ban_enabled_help: '短时间内点击过多磁力链接时暂时封禁该 IP，防止刷点击数。'
      ban_enabled_label: 启用点击防刷
