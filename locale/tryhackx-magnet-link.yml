      desktop_style_desc_standard: 标准布局：卡片仅一行，依次显示图标、种子名称、点击数以及复制和刷新按钮。名称过长时以省略号截断，悬停可查看完整名称。
      desktop_style_help: 选择桌面端帖子内磁力链接卡片的布局。手机始终使用移动端布局。
      desktop_style_label: 桌面端卡片样式
      desktop_style_mobile: 移动端样式（桌面端也使用）
      desktop_style_standard: 标准（当前样式）
      display_type_average: 所有数据取平均值
      display_type_average_max: 做种数和下载者取平均值，完成下载数取最大值
      display_type_help: '查询多个 Tracker 时如何汇总统计数据。'
      display_type_label: 统计汇总方式
      display_type_max_all: 所有数据取最大值
      guest_visible_help: 允许访客查看磁力链接。关闭后会提示访客登录或注册。
      guest_visible_label: 允许访客查看
