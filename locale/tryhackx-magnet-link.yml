      stats_justify_space_between: 两端对齐
      tooltip_enabled_help: 在讨论列表中悬停讨论时显示磁力链接统计。
      tooltip_enabled_label: 启用讨论列表悬浮提示
      tooltip_max_concurrent_help: '同时允许多少个悬浮提示抓取请求，默认 2 个。超过后会中止最早仍在执行的请求；移开鼠标或打开讨论也会中止对应请求。小型或共享主机可降至 1，服务器资源充足时可提高，最高 6。'
      tooltip_max_concurrent_label: 悬浮提示最大并发数
      tooltip_max_magnets_help: '悬浮提示中最多显示多少个磁力链接。设为 0 表示不限制。'
      tooltip_max_magnets_label: 悬浮提示最多显示磁力链接数
      tooltip_max_trackers_help: '悬浮提示中每个磁力链接最多查询多少个 Tracker。设为 0（默认）则沿用全局设置。无响应的 Tracker 会被跳过，整体仍受悬浮提示抓取时间限制。单独设置后会使用独立缓存，不会影响讨论页的完整统计。'
      tooltip_max_trackers_label: '悬浮提示最多查询 Tracker 数'
      tooltip_scrape_budget_help: '一次悬停中所有磁力链接共用的 Tracker 抓取时间上限。默认 4 秒。抓取会同步占用 PHP 工作进程，因此这里的时间较短；讨论页使用更长的时间上限。如果经常显示「无响应」，可适当调大。最高 30 秒。'
      tooltip_scrape_budget_label: 悬浮提示抓取时间上限（秒）
      tooltip_show_permission_errors_help: 访客或无权查看磁力链接的用户悬停相关讨论时，直接显示权限提示，而不是短暂显示加载状态后消失。默认启用。
      tooltip_show_permission_errors_label: 在悬浮提示中显示权限提示
      tooltip_tracker_timeout_help: '仅用于悬浮提示的单个 Tracker 超时时间。设为 0（默认）则沿用全局设置。降低该值（如 1 秒）可更快跳过失效或缓慢的 Tracker，在有限时间内尝试更多 Tracker。不会影响讨论页中的磁力链接卡片。'
      tooltip_tracker_timeout_label: '悬浮提示 Tracker 超时（秒）'
      topic_scrape_budget_help: '讨论页中单个磁力链接抓取 Tracker 数据的总时间上限。默认 15 秒。讨论页追求完整统计，因此比列表悬浮提示分配更长时间。最高 30 秒，避免单个请求长时间占用 PHP 工作进程。'
      topic_scrape_budget_label: 讨论页抓取时间上限（秒）
      tracker_timeout_help: '等待单个 Tracker 响应的最长时间。设为 0 使用默认值（2 秒）。'
      tracker_timeout_label: 'Tracker 超时（秒）'
